name: Deploy Emberfield to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test simulation rules
        run: npm test -- --silent
      - name: Verify wildlife continues moving
        run: npm run test:animals
      - name: Check research evidence and arithmetic
        run: npm run research:check
      - name: Verify a complete colony campaign
        run: npm run test:campaign
      - name: Verify cross-level excavation and construction
        run: npm run test:voxel
      - name: Verify biome generation and real opening campaigns on varied terrain
        run: npm run test:voxel:worldgen
      - name: Verify two food production cycles and material conservation
        run: npm run test:voxel:food
      - name: Verify multilevel housing and sleep persistence
        run: npm run test:voxel:housing
      - name: Verify physical power construction and room temperatures
        run: npm run test:voxel:power
      - name: Verify farming, cold storage and natural food spoilage
        run: npm run test:voxel:preservation
      - name: Verify finite storage, cross-level hauling and published save migration
        run: npm run test:voxel:logistics
      - name: Verify natural chunks, stonecutting bills and upper masonry construction
        run: npm run test:voxel:stonecutting
      - name: Build site with relative asset and Worker URLs
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
